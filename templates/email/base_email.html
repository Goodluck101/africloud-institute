<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <!--[if !mso]><!-->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!--<![endif]-->
</head>
<body style="margin:0;padding:0;background:#f4f6f8;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:28px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e7edf5;">
                    <tr>
                        <td style="background:#1a2550;padding:22px 28px;text-align:center;">
                            {% if logo_url %}
                            <img src="{{ logo_url }}" alt="{{ site.name }}" width="160" style="display:inline-block;max-width:160px;height:auto;background:#ffffff;border-radius:10px;padding:8px 12px;">
                            {% else %}
                            <p style="margin:0;font-family:'DM Sans',Calibri,'Segoe UI',Arial,sans-serif;font-size:20px;font-weight:700;color:#ffffff;">{{ site.name }}</p>
                            {% endif %}
                        </td>
                    </tr>
                    <tr>
                        <td style="height:6px;background:#3d9b3a;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td style="padding:32px 32px 12px;font-family:'DM Sans',Calibri,'Segoe UI',Arial,sans-serif;color:#243047;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 32px;font-family:'DM Sans',Calibri,'Segoe UI',Arial,sans-serif;color:#6b778c;font-size:13px;line-height:1.6;">
                            <p style="margin:0 0 8px 0;">{{ site.name }} · {{ site.location }}</p>
                            <p style="margin:0;">
                                <a href="mailto:{{ site.applications_email }}" style="color:#2c3e7d;text-decoration:none;">{{ site.applications_email }}</a>
                                {% if site.phone_display %} · {{ site.phone_display }}{% endif %}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
