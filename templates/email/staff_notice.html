{% extends "email/base_email.html" %}
{% block content %}
<p style="margin:0 0 8px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#3d9b3a;font-weight:700;">{{ kicker }}</p>
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.35;color:#1a2550;">{{ heading }}</h1>
<p style="margin:0 0 20px 0;font-size:15px;line-height:1.7;color:#445066;">{{ intro }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
    {% for row in rows %}
    <tr>
        <td style="padding:10px 0;border-bottom:1px solid #e7edf5;width:34%;font-size:13px;color:#6b778c;font-weight:700;vertical-align:top;">{{ row.label }}</td>
        <td style="padding:10px 0;border-bottom:1px solid #e7edf5;font-size:15px;color:#243047;vertical-align:top;">{{ row.value }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
